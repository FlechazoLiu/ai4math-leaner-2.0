[project]
name = "leaner-be"
version = "0.1.0"
description = "Backend service for Leaner application"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "prisma>=0.15.0",
    "protobuf>=4.25.1",
    "aiohttp>=3.9.0",
    "lean-interact>=0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leaner", "leaner_be"]

[tool.ruff]
extend-exclude = ["leaner", "scripts"]
